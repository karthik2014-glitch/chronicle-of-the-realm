<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles of the Realm</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div id="main-menu">
        <div class="menu-box">
            <h1 class="game-title">CHRONICLES<br><span class="subtitle">OF THE REALM</span></h1>
            <div class="pulse-container">
                <p class="menu-hint">CLICK ANYWHERE OR PRESS ANY KEY TO START</p>
            </div>
            <div class="controls-guide">
                <div class="guide-row"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> <span class="action-text">Explore Land</span></div>
                <div class="guide-row"><span class="key">SPACE</span> <span class="action-text">Melee Steel Blade</span></div>
                <div class="guide-row"><span class="key">SHIFT</span> <span class="action-text">Ice Spell Cast</span></div>
            </div>
        </div>
    </div>

    <div id="game-viewport">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="home.js"></script>
</body>
</html>
